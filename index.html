<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Design by Hưng</title>

    <meta name="description" content="Nơi hội tụ các tựa game giải trí cực cuốn dành cho nhóm bạn. Cùng tham gia Ma Sói, Gián Điệp và nhiều trò chơi hấp dẫn khác ngay trên điện thoại!">
    <meta name="theme-color" content="#1a1a2e">
    
    <!-- Favicon (Icon trên tab trình duyệt) -->
    <link rel="icon" type="image/png" href="https://i.pinimg.com/736x/62/41/43/624143f9744cdafd03384b1ac729dffd.jpg">
    <!-- Open Graph (Hiển thị xem trước trên Facebook, Zalo...) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Cổng Game Nhóm - Boardgame Online">
    <meta property="og:description" content="Nơi hội tụ các tựa game giải trí cực cuốn dành cho nhóm bạn. Khám phá ngay!">
    <meta property="og:image" content="https://nguyenthehung173205.github.io/game.png">
    <meta property="og:url" content="https://nguyenthehung173205.github.io/">
    
    <!-- Hiển thị xem trước trên Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Cổng Game Nhóm - Boardgame Online">
    <meta name="twitter:description" content="Nơi hội tụ các tựa game giải trí cực cuốn dành cho nhóm bạn.">
    <meta name="twitter:image" content="https://nguyenthehung173205.github.io/game.png">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        
        a:focus, a:active {
            outline: none;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #f9fafb; /* Màu trắng xám nhẹ tối giản */
            color: #111827; /* Màu xám đen, bớt chói hơn đen tuyền */
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 60px;
        }
        
        .header h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 15px;
            color: #6b7280;
            font-weight: 400;
        }

        .game-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 400px;
        }

        /* Thiết kế Thẻ bài phong cách Minimalism */
        .game-card {
            display: flex;
            align-items: center;
            padding: 20px 24px;
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            text-decoration: none;
            color: inherit;
            transition: all 0.2s ease;
            gap: 3px;
        }

        .game-card:hover {
            border-color: #d1d5db;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            transform: translateY(-2px);
        }

        .game-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            font-size: 20px;
            margin-right: 20px;
            flex-shrink: 0;
            background-color: #f3f4f6;
            color: #374151;
        }

        .game-info {
            display: flex;
            flex-direction: column;
        }

        .game-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .game-desc {
            font-size: 13px;
            color: #6b7280;
            line-height: 1.5;
        }

        .game-card i.fa-arrow-right {
            margin-left: auto;
            font-size: 14px;
            color: #9ca3af;
            transition: transform 0.2s ease;
        }

        .game-card:hover i.fa-arrow-right {
            transform: translateX(4px);
            color: #111827;
        }

        .footer {
            margin-top: 60px;
            font-size: 12px;
            color: #9ca3af;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Design by Hưng</h1>
        <p>Tuyển tập Mini Games</p>
    </div>

    <div class="game-grid">
        <!-- Game 1: Ma Sói -->
        <a href="https://nguyenthehung173205.github.io/ma_soi/" class="game-card" target="_self">
            <div class="game-icon">
                <i class="fa-solid fa-moon"></i>
            </div>
            <div class="game-info">
                <div class="game-title">Ma Sói</div>
                <div class="game-desc">Đấu trí sinh tồn, lừa gạt và phán đoán.</div>
            </div>
            <i class="fa-solid fa-arrow-right"></i>
        </a>

        <!-- Game 2: Undercover -->
        <a href="https://nguyenthehung173205.github.io/gian_diep/" class="game-card" target="_self">
            <div class="game-icon">
                <i class="fa-solid fa-user-secret"></i>
            </div>
            <div class="game-info">
                <div class="game-title">Truy Tìm Gián Điệp</div>
                <div class="game-desc">Bảo vệ từ khóa, truy tìm nội gián lẩn trốn.</div>
            </div>
            <i class="fa-solid fa-arrow-right"></i>
        </a>
    </div>

    <div class="footer">
        © 2026 Design by Hưng
    </div>

</body>
</html>
