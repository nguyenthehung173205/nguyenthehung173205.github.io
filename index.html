<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Design by Hưng - Mini Games</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0c10;
            --panel-bg: #1f2833;
            --text-main: #c5c6c7;
            --accent-wolf: #ff4c4c;
            --accent-spy: #66fcf1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Roboto', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 36px;
            margin-bottom: 40px;
            color: white;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(255,255,255,0.2);
        }
        h1 span {
            color: var(--accent-spy);
        }

        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 400px;
        }

        .game-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
            padding: 20px;
            border-radius: 15px;
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: bold;
            transition: all 0.3s ease;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }

        .btn-werewolf {
            background: linear-gradient(135deg, #4a0000, #1a0000);
            color: var(--accent-wolf);
            border: 2px solid var(--accent-wolf);
        }
        .btn-werewolf:hover {
            background: var(--accent-wolf);
            color: white;
            box-shadow: 0 0 20px var(--accent-wolf);
        }

        .btn-spy {
            background: linear-gradient(135deg, #0f3460, #1a1a2e);
            color: var(--accent-spy);
            border: 2px solid var(--accent-spy);
        }
        .btn-spy:hover {
            background: var(--accent-spy);
            color: #1a1a2e;
            box-shadow: 0 0 20px var(--accent-spy);
        }

        .game-btn i {
            font-size: 28px;
        }

        .footer {
            margin-top: 50px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>

    <h1>Design by <span>Hưng</span></h1>

    <div class="menu-container">
        <!-- Chuyển hướng trong cùng tab (target="_self") -->
        <a href="https://nguyenthehung173205.github.io/ma_soi/" class="game-btn btn-werewolf" target="_self">
            <i class="fa-solid fa-moon"></i> MA SÓI
        </a>

        <a href="https://nguyenthehung173205.github.io/gian_diep/" class="game-btn btn-spy" target="_self">
            <i class="fa-solid fa-user-secret"></i> TRUY TÌM GIÁN ĐIỆP
        </a>
    </div>

    <div class="footer">
        © 2026 Bản quyền thuộc về Hưng
    </div>

</body>
</html>
